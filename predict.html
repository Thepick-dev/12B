<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOALSTORM! — WORLD CUP 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050510; --panel:#0b0b1f; --neon:#00f6ff; --ok:#22ff88; --warn:#ffcc00; --dim:#666;
  --cyan:#00F6FF; --yellow:#FFD60A; --pink:#FF2FC7; --white:#F7F7F2;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{margin:0;background:radial-gradient(circle at top,#0c0c2a,#000);color:#e8faff;font-family:"Press Start 2P",monospace;text-align:center;display:flex;flex-direction:column;align-items:center;}
.panel{width:100%;max-width:960px;background:var(--panel);border:2px solid var(--neon);box-shadow:0 0 25px rgba(0,246,255,.35);padding:20px;margin-bottom:20px;}
h1{font-size:18px;margin:0 0 16px;color:var(--neon);text-shadow:0 0 8px rgba(0,246,255,.8);}
.sys{margin:12px 0;font-size:10px;color:var(--warn);}
input, select{width:100%;padding:10px;margin:8px 0;background:#000;color:#e8faff;border:2px solid var(--dim);font-family:inherit;font-size:10px;}
input:disabled, select:disabled{opacity:.4;}
button{padding:10px 14px;margin:6px;font-family:inherit;font-size:10px;background:#000;color:var(--neon);border:2px solid var(--neon);cursor:pointer;}
button:disabled{opacity:.35;border-color:var(--dim);color:var(--dim);cursor:not-allowed;}
.group{border:1px solid var(--dim);margin:12px 0;padding:10px;}
.groups-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:10px;}
.group h4{font-size:10px;margin-bottom:6px;color:var(--neon);text-transform:uppercase;}
.team-list{display:flex;flex-direction:column;gap:4px;width:100%;}
.team-row{display:flex;justify-content:space-between;align-items:center;gap:4px;}
.team-name{font-size:10px;color:var(--neon);flex:1;text-align:left;}
.team-btn{font-family:'Press Start 2P',monospace;font-size:10px;padding:4px 6px;border-radius:6px;border:2px solid var(--neon);background:transparent;color:var(--neon);cursor:pointer;outline:none;min-height:28px;transition:all .12s;}
.team-btn.selected-2{background:var(--ok);color:#000;box-shadow:0 0 12px var(--ok);}
.team-btn.selected-3{background:var(--warn);color:#000;box-shadow:0 0 12px var(--warn);}

/* Version 4 modal */
.overlay{position:fixed;inset:0;background:rgba(10,10,26,0.96);display:none;align-items:center;justify-content:center;z-index:10;}
.modal{width:92%;max-width:960px;text-align:center;}
.top-player{border:6px solid var(--yellow);padding:16px;font-size:18px;margin-bottom:12px;text-shadow:0 0 12px var(--yellow);}
.subtitle{font-size:10px;margin-bottom:18px;color:var(--yellow);}
.actions{display:flex;justify-content:center;gap:20px;margin-bottom:20px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:20px;}
.player-box{border:2px solid rgba(0,246,255,0.2);padding:10px 4px;font-size:9px;text-align:center;transition:all .12s;}
.player-box.active{text-shadow:0 0 8px currentColor;}
.player-box.selected{border-color:var(--yellow);color:var(--yellow);text-shadow:0 0 10px var(--yellow);}
.info{font-size:9px;margin-top:14px;color:var(--pink);}
.success{display:none;font-size:14px;color:var(--yellow);text-shadow:0 0 12px var(--yellow);}
.shake{animation:shake 0.35s;}
@keyframes shake{0%,100%{transform:translate(0,0);}20%{transform:translate(-6px,0);}40%{transform:translate(6px,0);}60%{transform:translate(-4px,0);}80%{transform:translate(4px,0);}}
</style>
</head>
<body>

<img src="banner.png" class="banner" alt="GOALSTORM! Banner">

<!-- PLAYER ENTRY -->
<div class="panel">
<h1>PLAYER ENTRY TERMINAL</h1>
<div class="sys">INSERT USER DATA</div>
<input id="username" placeholder="USERNAME">
<input id="email" placeholder="EMAIL" disabled>
<select id="combo" disabled>
<option value="">GOALSCORER COMBINATION</option>
<option>Messi & Ronaldo</option>
<option>Neymar & Mbappé</option>
<option>Lewandowski & Haaland</option>
<option>Salah & Mané</option>
<option>Kane & Sterling</option>
<option>Modrić & De Bruyne</option>
<option>Mbappé & Benzema</option>
<option>Son & Raphinha</option>
<option>Haaland & De Bruyne</option>
<option>Vinícius & Pedri</option>
</select>
<input id="goals" placeholder="TOTAL GROUP GOALS" type="number" disabled>
<div class="sys" id="s1msg"></div>
</div>

<!-- GROUP STAGE -->
<div class="panel">
<h1>GROUP STAGE</h1>
<div class="sys">SELECT 2ND PLACE IN EACH GROUP — THEN SELECT 8 THIRD-PLACE QUALIFIERS</div>
<div class="groups-grid" id="groupsGrid"></div>
<div class="sys" id="groupMsg"></div>
</div>

<button id="lockBtn" disabled>LOCK PICKS & PROCEED TO RANDOM PLAYER SELECTOR</button>

<!-- VERSION 4 MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="top-player" id="topPlayer"></div>
    <div class="subtitle">is your random player. Do you want to</div>
    <div class="actions">
      <button id="stickBtn">STICK (AND SUBMIT)</button>
      <button id="twistBtn">TWIST (2 REMAINING)</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="info" id="info"></div>
    <div class="success" id="success">PICKS SUBMITTED!</div>
  </div>
</div>

<script>
'use strict';

/* ---------- STAGE 1 ---------- */
const usernameInput=document.getElementById('username'),
      emailInput=document.getElementById('email'),
      comboSelect=document.getElementById('combo'),
      goalsInput=document.getElementById('goals'),
      s1msg=document.getElementById('s1msg'),
      lockBtn=document.getElementById('lockBtn');

usernameInput.oninput=()=>{ if(usernameInput.value.length>2) emailInput.disabled=false; }
emailInput.oninput=()=>{ if(emailInput.value.includes('@')) comboSelect.disabled=false; }
comboSelect.onchange=()=>{ if(comboSelect.value) goalsInput.disabled=false; }
goalsInput.oninput=()=>{ if(goalsInput.value>0){ s1msg.textContent='PLAYER DATA READY — COMPLETE GROUP PICKS'; checkSubmit(); } }

/* ---------- STAGE 2 ---------- */
const GROUPS=[
["MEXICO 🇲🇽","SOUTH AFRICA 🇿🇦","SOUTH KOREA 🇰🇷","DEN/MAC/CZE/IRL"],
["CANADA 🇨🇦","ITA/NIR/WAL/BOS","QATAR 🇶🇦","SWITZERLAND 🇨🇭"],
["BRAZIL 🇧🇷","MOROCCO 🇲🇦","HAITI 🇭🇹","SCOTLAND 🏴"],
["USA 🇺🇸","PARAGUAY 🇵🇾","AUSTRALIA 🇦🇺","TUR/ROU/SVK/KOS"],
["GERMANY 🇩🇪","CURAÇAO 🇨🇼","IVORY COAST 🇨🇮","ECUADOR 🇪🇨"],
["NETHERLANDS 🇳🇱","JAPAN 🇯🇵","UKR/SWE/POL/ALB","TUNISIA 🇹🇳"],
["BELGIUM 🇧🇪","EGYPT 🇪🇬","IRAN 🇮🇷","NEW ZEALAND 🇳🇿"],
["SPAIN 🇪🇸","CAPE VERDE 🇨🇻","SAUDI ARABIA 🇸🇦","URUGUAY 🇺🇾"],
["FRANCE 🇫🇷","SENEGAL 🇸🇳","BOL/SUR/IRQ","NORWAY 🇳🇴"],
["ARGENTINA 🇦🇷","ALGERIA 🇩🇿","AUSTRIA 🇦🇹","JORDAN 🇯🇴"],
["PORTUGAL 🇵🇹","JAM/NCL/DRC","UZBEKISTAN 🇺🇿","COLOMBIA 🇨🇴"],
["ENGLAND 🏴","CROATIA 🇭🇷","GHANA 🇬🇭","PANAMA 🇵🇦"]
];

const MAX_THIRD=8;
const state={ secondPicks:Array(GROUPS.length).fill(null), thirdPicks:Array(GROUPS.length).fill(null) };
const groupsGrid=document.getElementById('groupsGrid');
const groupMsg=document.getElementById('groupMsg');

function flash(msg){ const orig=groupMsg.textContent; groupMsg.textContent=msg; setTimeout(()=>groupMsg.textContent=orig,1200); }

function createGroupEl(groupIndex, teams){
  const g=document.createElement('div'); g.className='group';
  g.innerHTML=`<h4>GROUP ${groupIndex+1}</h4><div class="team-list"></div>`;
  const list=g.querySelector('.team-list');
  teams.forEach((team,idx)=>{
    const row=document.createElement('div'); row.className='team-row';
    const nameSpan=document.createElement('span'); nameSpan.className='team-name'; nameSpan.textContent=team;
    const btn2=document.createElement('button'); btn2.className='team-btn'; btn2.textContent='2nd';
    btn2.addEventListener('click',()=>toggleSecond(groupIndex,idx,btn2));
    const btn3=document.createElement('button'); btn3.className='team-btn'; btn3.textContent='3rd';
    btn3.addEventListener('click',()=>toggleThird(groupIndex,idx,btn3));
    row.appendChild(nameSpan); row.appendChild(btn2); row.appendChild(btn3);
    list.appendChild(row);
  });
  return g;
}

function renderGroups(){ groupsGrid.innerHTML=''; GROUPS.forEach((g,i)=>groupsGrid.appendChild(createGroupEl(i,g))); }
renderGroups();

function toggleSecond(group,i,btn){
  if(state.thirdPicks[group]===i){ flash('Already selected as 3rd-place'); return; }
  if(state.secondPicks[group]===i){ state.secondPicks[group]=null; btn.classList.remove('selected-2'); }
  else{
    state.secondPicks[group]=i;
    btn.closest('.team-list').querySelectorAll('.selected-2').forEach(b=>b.classList.remove('selected-2'));
    btn.classList.add('selected-2');
  }
  checkSubmit();
}

function toggleThird(group,i,btn){
  if(state.secondPicks[group]===i){ flash('Already selected as 2nd-place'); return; }
  const totalThird=state.thirdPicks.filter(x=>x!==null).length;
  if(state.thirdPicks[group]===i){ state.thirdPicks[group]=null; btn.classList.remove('selected-3'); }
  else{
    if(totalThird>=MAX_THIRD){ flash('Already 8 third-place teams selected'); return; }
    if(state.thirdPicks[group]!==null){
      const prevBtn=btn.closest('.team-list').querySelector('.selected-3');
      if(prevBtn) prevBtn.classList.remove('selected-3');
    }
    state.thirdPicks[group]=i; btn.classList.add('selected-3');
  }
  checkSubmit();
}

function checkSubmit(){
  const allFilled=usernameInput.value.trim() && emailInput.value.trim() && comboSelect.value && goalsInput.value.trim()!=='';
  const secondComplete=state.secondPicks.filter(x=>x!==null).length===GROUPS.length;
  const thirdComplete=state.thirdPicks.filter(x=>x!==null).length===MAX_THIRD;
  lockBtn.disabled=!(allFilled && secondComplete && thirdComplete);
}

/* ---------- VERSION 4 ---------- */
const PLAYERS = ['MESSI','RONALDO','MBAPPÉ','HAALAND','SALAH','KANE','NEYMAR','BENZEMA','MODRIĆ','DE BRUYNE','VINÍCIUS','PEDRI','GRIEZMANN','BELLINGHAM','LEWANDOWSKI','SON','OSIMHEN','SAKA','RASHFORD','ALVAREZ','GREALISH','FODEN','ØDEGAARD','MUSIALA','KVARA','VALVERDE','DIMARIA','LUKAKU','DAVIES','RODRI'];
const NEON_COLORS = ['#00F6FF','#FF2FC7','#FFD60A','#2DFF7A','#FFFFFF'];
let twistsRemaining=2, finalPlayer=null, finalIndex=null, locked=false;
const overlay=document.getElementById('overlay'), gridEl=document.getElementById('grid'), topPlayerEl=document.getElementById('topPlayer'), stickBtn=document.getElementById('stickBtn'), twistBtn=document.getElementById('twistBtn'), infoEl=document.getElementById('info'), successEl=document.getElementById('success');

lockBtn.addEventListener('click',()=>{ overlay.style.display='flex'; initRandomPlayer(); });

function initRandomPlayer(){
  gridEl.innerHTML=''; successEl.style.display='none'; infoEl.textContent=''; twistsRemaining=2; locked=false;
  PLAYERS.forEach(name=>{ const d=document.createElement('div'); d.className='player-box'; d.textContent=name; gridEl.appendChild(d); });
  finalIndex=Math.floor(Math.random()*PLAYERS.length);
  finalPlayer=PLAYERS[finalIndex];
  updateTop(finalPlayer); updateTwistText();
}

function randomNeon(){ return NEON_COLORS[Math.floor(Math.random()*NEON_COLORS.length)]; }
function updateTop(name){ topPlayerEl.textContent=name; }
function updateTwistText(){ twistBtn.textContent=`TWIST (${twistsRemaining} REMAINING)`; }

function countdownThen(callback){ let i=0; const messages=['READY','SET','TWIST!']; const interval=setInterval(()=>{ topPlayerEl.textContent=messages[i]; i++; if(i>=messages.length){ clearInterval(interval); callback(); } },200); }

stickBtn.addEventListener('click',()=>{ if(locked) return; locked=true; freezeFrame(); successEl.style.display='block'; infoEl.textContent=`FINAL PLAYER: ${finalPlayer}`; /* TODO: write all Stage 3 + final player info to Google Sheet here */ });

twistBtn.addEventListener('click',()=>{ if(locked || twistsRemaining===0) return; twistsRemaining--; updateTwistText(); finalIndex=Math.floor(Math.random()*PLAYERS.length); finalPlayer=PLAYERS[finalIndex]; countdownThen(()=>{ runTwistAnimation(()=>{ updateTop(finalPlayer); if(twistsRemaining===0){ locked=true; infoEl.textContent='FINAL PLAYER LOCKED'; freezeFrame(); } }); }); });

function runTwistAnimation(done){ const boxes=[...document.querySelectorAll('.player-box')]; let index=0, cycles=0; boxes.forEach(b=>{b.classList.remove('active','selected'); b.style.color=''; b.style.borderColor='';}); const interval=setInterval(()=>{ boxes.forEach(b=>{b.classList.remove('active'); b.style.color=''; b.style.borderColor='';}); const color=randomNeon(); boxes[index].classList.add('active'); boxes[index].style.color=color; boxes[index].style.borderColor=color; if(index===finalIndex && cycles>=2){ clearInterval(interval); boxes[index].classList.remove('active'); boxes[index].classList.add('selected'); boxes[index].style.color='var(--yellow)'; boxes[index].style.borderColor='var(--yellow)'; done(); return; } index=(index+1)%boxes.length; if(index===0) cycles++; },70); }

function freezeFrame(){ const boxes=[...document.querySelectorAll('.player-box')]; const idx=PLAYERS.indexOf(finalPlayer); boxes.forEach(b=>{ if(PLAYERS.indexOf(b.textContent)===idx){ b.classList.add('selected'); b.style.color='var(--yellow)'; b.style.borderColor='var(--yellow)'; } else { b.classList.remove('active','selected'); b.style.color=''; b.style.borderColor=''; } }); topPlayerEl.classList.add('shake'); setTimeout(()=>topPlayerEl.classList.remove('shake'),350); }
</script>

</body>
</html>
