<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOALSTORM! — WORLD CUP 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
:root{
  --panel:#0b0b1f;
  --neon:#00f6ff;
  --ok:#22ff88;
  --warn:#ffcc00;
  --dim:#666;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(circle at top, #0c0c2a, #000);
  color:#e8faff;
  font-family:"Press Start 2P", monospace;
  text-align:center;
}
.stage{min-height:100vh;padding:16px;display:none;align-items:center;justify-content:center}
.stage.active{display:flex}
.panel{width:100%;max-width:960px;background:var(--panel);border:2px solid var(--neon);padding:20px}
h1{font-size:18px;color:var(--neon);margin-bottom:16px}
.sys{font-size:10px;color:var(--warn);margin:10px 0}
input,select{
  width:100%;padding:10px;margin:8px 0;
  background:#000;color:#e8faff;
  border:2px solid var(--dim);
  font-family:inherit;font-size:10px
}
button{
  padding:8px 12px;margin:4px;
  font-family:inherit;font-size:10px;
  background:#000;color:var(--neon);
  border:2px solid var(--neon)
}
button:disabled{opacity:.35;border-color:var(--dim);color:var(--dim)}
.locked{border-color:var(--ok)!important;color:var(--ok)!important}
.group{border:1px solid var(--dim);margin:12px 0;padding:10px}
.teams{display:grid;grid-template-columns:1fr auto auto;gap:6px;font-size:9px}
.team{text-align:left}
.btn2{color:var(--ok);border-color:var(--ok)}
.btn3{color:var(--warn);border-color:var(--warn)}
.fullscreen{position:fixed;inset:0;background:#000;display:none;flex-direction:column;justify-content:center;align-items:center;z-index:999}
.fullscreen.active{display:flex}
.player-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;width:90%;max-width:900px}
.player{padding:12px;border:2px solid var(--dim);font-size:9px}
.player.active{border-color:var(--neon)}
.final{font-size:14px;color:var(--ok)}
</style>
</head>

<body>

<!-- STAGE 1 -->
<section class="stage active" id="stage1">
  <div class="panel">
    <h1>GOALSTORM! — WORLD CUP 2026</h1>
    <div class="sys">PLAYER ENTRY TERMINAL</div>
    <input id="username" placeholder="USERNAME">
    <input id="email" placeholder="EMAIL" disabled>
    <select id="combo" disabled>
      <option value="">GOALSCORER COMBINATION</option>
      <option>Messi & Ronaldo</option>
      <option>Neymar & Mbappé</option>
      <option>Lewandowski & Haaland</option>
      <option>Salah & Mané</option>
      <option>Kane & Sterling</option>
      <option>Modrić & De Bruyne</option>
      <option>Mbappé & Benzema</option>
      <option>Son & Raphinha</option>
      <option>Haaland & De Bruyne</option>
      <option>Vinícius & Pedri</option>
    </select>
    <input id="goals" placeholder="TOTAL GROUP GOALS" type="number" disabled>
    <div class="sys" id="s1msg"></div>
  </div>
</section>

<!-- STAGE 2 -->
<section class="stage" id="stage2">
  <div class="panel">
    <h1>GROUP STAGE</h1>
    <div class="sys">SELECT 2ND PLACE IN EACH GROUP — THEN SELECT 8 THIRD-PLACE QUALIFIERS</div>
    <div id="groups"></div>
    <div class="sys" id="groupMsg"></div>
  </div>
</section>

<!-- STAGE 3 -->
<div class="fullscreen" id="selector">
  <h1>RANDOM PLAYER SELECTED</h1>
  <div class="player-grid" id="players"></div>
  <div class="sys" id="twists">TWISTS REMAINING: 2</div>
  <button id="stick">STICK (AND SUBMIT)</button>
  <button id="twist">TWIST</button>
</div>

<!-- STAGE 4 -->
<section class="stage" id="stage4">
  <div class="panel">
    <h1 class="final">ALL PICKS SUBMITTED</h1>
    <div class="sys">FINAL DECISION CONFIRMED</div>
  </div>
</section>

<script>
/* ---------- STAGE 1 ---------- */
username.oninput=()=>username.value.length>2&&(email.disabled=false);
email.oninput=()=>email.value.includes("@")&&(combo.disabled=false);
combo.onchange=()=>combo.value&&(goals.disabled=false);
goals.oninput=()=>goals.value>0&&(s1msg.textContent="PLAYER VERIFIED — PROCEED TO GROUP STAGE",
setTimeout(()=>{stage1.classList.remove("active");stage2.classList.add("active")},1200));

/* ---------- STAGE 2 (FIXED) ---------- */
const groupsData=[
["Group 1",["Mexico 🇲🇽","South Africa 🇿🇦","South Korea 🇰🇷","Denmark / Macedonia / Czech Republic / Ireland"]],
["Group 2",["Canada 🇨🇦","Italy / Northern Ireland / Wales / Bosnia","Qatar 🇶🇦","Switzerland 🇨🇭"]],
["Group 3",["Brazil 🇧🇷","Morocco 🇲🇦","Haiti 🇭🇹","Scotland 🏴"]],
["Group 4",["USA 🇺🇸","Paraguay 🇵🇾","Australia 🇦🇺","Turkey / Romania / Slovakia / Kosovo"]],
["Group 5",["Germany 🇩🇪","Curaçao 🇨🇼","Ivory Coast 🇨🇮","Ecuador 🇪🇨"]],
["Group 6",["Netherlands 🇳🇱","Japan 🇯🇵","Ukraine / Sweden / Poland / Albania","Tunisia 🇹🇳"]],
["Group 7",["Belgium 🇧🇪","Egypt 🇪🇬","Iran 🇮🇷","New Zealand 🇳🇿"]],
["Group 8",["Spain 🇪🇸","Cape Verde 🇨🇻","Saudi Arabia 🇸🇦","Uruguay 🇺🇾"]],
["Group 9",["France 🇫🇷","Senegal 🇸🇳","Bolivia / Suriname / Iraq","Norway 🇳🇴"]],
["Group 10",["Argentina 🇦🇷","Algeria 🇩🇿","Austria 🇦🇹","Jordan 🇯🇴"]],
["Group 11",["Portugal 🇵🇹","Jamaica / New Caledonia / DR Congo","Uzbekistan 🇺🇿","Colombia 🇨🇴"]],
["Group 12",["England 🏴","Croatia 🇭🇷","Ghana 🇬🇭","Panama 🇵🇦"]]
];

let seconds=0, thirds=0;

groupsData.forEach(([name,teams])=>{
  let secondLocked=false, thirdLocked=false;
  const box=document.createElement("div");
  box.className="group";
  box.innerHTML=`<div class="sys">${name}</div>`;
  const grid=document.createElement("div");
  grid.className="teams";

  teams.forEach(team=>{
    const label=document.createElement("div");
    label.className="team"; label.textContent=team;
    const b2=document.createElement("button");
    b2.textContent="2ND"; b2.className="btn2";
    const b3=document.createElement("button");
    b3.textContent="3RD"; b3.className="btn3";

    b2.onclick=()=>{
      if(secondLocked)return;
      secondLocked=true; seconds++;
      b2.classList.add("locked");
      grid.querySelectorAll("button").forEach(b=>b.disabled=true);
      checkStage2();
    };

    b3.onclick=()=>{
      if(thirdLocked||thirds>=8)return;
      thirdLocked=true; thirds++;
      b3.classList.add("locked");
      grid.querySelectorAll(".btn3").forEach(b=>b!==b3&&(b.disabled=true));
      if(thirds===8) groupMsg.textContent="THIRD-PLACE LIMIT REACHED";
      checkStage2();
    };

    grid.append(label,b2,b3);
  });

  box.appendChild(grid);
  groups.appendChild(box);
});

function checkStage2(){
  if(seconds===12 && thirds===8){
    groupMsg.textContent="GROUP STAGE COMPLETE — FINAL PHASE UNLOCKED";
    setTimeout(()=>{
      stage2.classList.remove("active");
      selector.classList.add("active");
      startSelector();
    },1200);
  }
}

/* ---------- STAGE 3 ---------- */
const pool=["Messi","Ronaldo","Mbappé","Haaland","Salah","Kane","Neymar","Benzema","Modrić","De Bruyne",
"Vinícius","Pedri","Griezmann","Bellingham","Lewandowski","Son","Osimhen","Saka","Rashford","Álvarez",
"Grealish","Foden","Ødegaard","Musiala","Kvaratskhelia","Valverde","Di María","Lukaku","Davies","Rodri"];

let index=0,twistsLeft=2,spinning=false;
pool.forEach(p=>{const d=document.createElement("div");d.className="player";d.textContent=p;players.appendChild(d)});

function highlight(i){
  [...players.children].forEach(c=>c.classList.remove("active"));
  players.children[i].classList.add("active");
}
function startSelector(){index=Math.floor(Math.random()*pool.length);highlight(index)}

twist.onclick=()=>{
  if(spinning||twistsLeft<=0)return;
  spinning=true; twistsLeft--;
  twists.textContent="TWISTS REMAINING: "+twistsLeft;
  let c=0;
  const spin=setInterval(()=>{
    index=(index+1)%pool.length; highlight(index); c++;
    if(c>30){clearInterval(spin);spinning=false;twistsLeft===0&&lockFinal()}
  },80);
};
stick.onclick=lockFinal;
function lockFinal(){
  selector.classList.remove("active");
  stage4.classList.add("active");
}
</script>

</body>
</html>
