<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOALSTORM! — SCORES</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050510; --panel:#0b0b1f; --neon:#00f6ff; --ok:#22ff88; --warn:#ffcc00; --dim:#666;
  --cyan:#00F6FF; --yellow:#FFD60A; --pink:#FF2FC7; --white:#F7F7F2;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{margin:0;background:radial-gradient(circle at top,#0c0c2a,#000);color:#e8faff;font-family:"Press Start 2P",monospace;text-align:center;display:flex;flex-direction:column;align-items:center;min-height:100vh;}

/* NAV */
.nav{width:100%;max-width:960px;display:flex;justify-content:space-around;border:2px solid var(--neon);background:#000;margin:16px 0 10px;}
.nav a{font-size:10px;padding:10px 6px;color:var(--dim);text-decoration:none;}
.nav a.active{color:var(--neon);text-shadow:0 0 8px rgba(0,246,255,.8);}

/* PANELS */
.panel{width:100%;max-width:960px;background:var(--panel);border:2px solid var(--neon);box-shadow:0 0 25px rgba(0,246,255,.35);padding:40px 20px;margin-bottom:20px;flex:1;}
h1{font-size:18px;margin:0 0 16px;color:var(--neon);text-shadow:0 0 8px rgba(0,246,255,.8);}
.sys{margin:12px 0;font-size:12px;color:var(--warn);}
.sys.prominent{font-size:14px;color:var(--yellow);text-shadow:0 0 10px rgba(255,214,10,.8);line-height: 1.6;}

/* BANNER */
.banner {
  max-width: 600px;
  width: 100%;
  height: auto;
  display: block;
  margin-bottom: 20px;
}

/* FOOTER */
footer{width:100%;max-width:960px;margin:20px 0;padding:20px;border-top:1px solid var(--dim);font-size:8px;}
footer a{color:var(--dim);text-decoration:none;transition:color 0.2s;}
footer a:hover{color:var(--neon);text-shadow:0 0 5px var(--neon);}

</style>
</head>
<body>

<div class="nav">
  <a href="index.html">HOME</a>
  <a href="predict.html">PLAY</a>
  <a href="scores.html" class="active">SCORES</a>
  <a href="rules.html">RULES</a>
</div>

<img src="banner 1.jpg" class="banner" alt="GOALSTORM! Banner">

<div class="panel">
  <h1>TOURNAMENT STANDINGS</h1>
  <br>
  <div class="sys prominent">SCORES TO FOLLOW ONCE THE GAME STARTS</div>
  <br>
  <div class="sys">CHECK BACK IN JUNE 2026</div>
</div>

<footer>
  <a href="privacy.html">PRIVACY POLICY</a> | © 2026 GOALSURGE
</footer>

</body>
</html>
